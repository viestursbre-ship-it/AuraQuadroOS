name: Build macOS Binary

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Lejupielādēt kodu
        uses: actions/checkout@v4

      - name: Uzstādīt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalēt visas atkarības
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Kompilēt macOS aplikāciju ar PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "AuraQuadroOS" \
            --collect-all customtkinter \
            --collect-all docx \
            --add-data "config.json:." \
            radar_service.py

      - name: Arhivēt .app failu ZIP arhīvā
        run: |
          cd dist
          zip -r AuraQuadroOS-macOS.zip AuraQuadroOS.app

      - name: Saglabāt gatavo failu (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AuraQuadroOS-macOS
          path: dist/AuraQuadroOS-macOS.zip